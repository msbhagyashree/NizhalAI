<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Sky gradient: deep blue to warm orange-gold at horizon -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2d5e"/>
      <stop offset="60%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c97a1a"/>
      <stop offset="100%" stop-color="#8b5e0a"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8c0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd740" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </radialGradient>
    <!-- Card background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2040" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0d2d50" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="630" fill="url(#skyGrad)"/>

  <!-- Ground strip -->
  <rect x="0" y="520" width="1200" height="110" fill="url(#groundGrad)"/>

  <!-- Sun -->
  <circle cx="600" cy="510" r="160" fill="url(#sunGlow)" opacity="0.7"/>
  <circle cx="600" cy="510" r="55" fill="#fff8c0"/>
  <circle cx="600" cy="510" r="42" fill="#ffd740"/>

  <!-- Heat shimmer lines -->
  <g stroke="#ffd740" stroke-width="1.5" opacity="0.22">
    <line x1="390" y1="520" x2="380" y2="620"/>
    <line x1="430" y1="520" x2="420" y2="630"/>
    <line x1="470" y1="520" x2="462" y2="630"/>
    <line x1="510" y1="520" x2="505" y2="630"/>
    <line x1="550" y1="520" x2="548" y2="630"/>
    <line x1="600" y1="520" x2="600" y2="630"/>
    <line x1="650" y1="520" x2="652" y2="630"/>
    <line x1="690" y1="520" x2="695" y2="630"/>
    <line x1="730" y1="520" x2="738" y2="630"/>
    <line x1="770" y1="520" x2="780" y2="630"/>
    <line x1="810" y1="520" x2="820" y2="630"/>
  </g>

  <!-- Tree silhouette (shade tree) left -->
  <g opacity="0.85">
    <!-- trunk -->
    <rect x="148" y="430" width="14" height="95" fill="#2d1b0e"/>
    <!-- canopy layers -->
    <ellipse cx="155" cy="420" rx="70" ry="55" fill="#1a4a1a"/>
    <ellipse cx="130" cy="400" rx="45" ry="38" fill="#1e5c1e"/>
    <ellipse cx="180" cy="395" rx="50" ry="40" fill="#1e5c1e"/>
    <ellipse cx="155" cy="378" rx="52" ry="35" fill="#256625"/>
    <!-- shade circle on ground -->
    <ellipse cx="155" cy="525" rx="70" ry="12" fill="#0a1a0a" opacity="0.4"/>
  </g>

  <!-- Tree silhouette (shade tree) right -->
  <g opacity="0.85">
    <rect x="1038" y="430" width="14" height="95" fill="#2d1b0e"/>
    <ellipse cx="1045" cy="420" rx="70" ry="55" fill="#1a4a1a"/>
    <ellipse cx="1020" cy="400" rx="45" ry="38" fill="#1e5c1e"/>
    <ellipse cx="1070" cy="395" rx="50" ry="40" fill="#1e5c1e"/>
    <ellipse cx="1045" cy="378" rx="52" ry="35" fill="#256625"/>
    <ellipse cx="1045" cy="525" rx="70" ry="12" fill="#0a1a0a" opacity="0.4"/>
  </g>

  <!-- Street vendor silhouette (centre-left) -->
  <g fill="#1a1a2e" opacity="0.75">
    <!-- umbrella canopy -->
    <ellipse cx="310" cy="440" rx="48" ry="10" fill="#c0392b" opacity="0.9"/>
    <path d="M262 440 Q310 405 358 440 Z" fill="#c0392b" opacity="0.9"/>
    <!-- pole -->
    <rect x="308" y="440" width="4" height="80" fill="#7f8c8d"/>
    <!-- person -->
    <circle cx="295" cy="468" r="10" fill="#5d4037"/>
    <rect x="289" y="478" width="12" height="30" fill="#3e2723"/>
    <rect x="283" y="480" width="8" height="20" fill="#3e2723"/>
    <rect x="301" y="480" width="8" height="20" fill="#3e2723"/>
    <!-- cart -->
    <rect x="275" y="508" width="50" height="14" rx="2" fill="#795548"/>
    <circle cx="283" cy="524" r="6" fill="#424242"/>
    <circle cx="317" cy="524" r="6" fill="#424242"/>
  </g>

  <!-- Water drop icon (right side) -->
  <g transform="translate(860, 410)" filter="url(#glow)">
    <path d="M30 0 C30 0 0 35 0 52 C0 69 14 82 30 82 C46 82 60 69 60 52 C60 35 30 0 30 0Z"
          fill="#1a8fc1" opacity="0.85"/>
    <path d="M30 15 C30 15 12 42 12 54 C12 64 20 72 30 72 C40 72 48 64 48 54 C48 42 30 15 30 15Z"
          fill="#5dade2" opacity="0.5"/>
  </g>

  <!-- Main card -->
  <rect x="120" y="60" width="960" height="330" rx="18" fill="url(#cardBg)" filter="url(#shadow)"/>
  <!-- Card accent line -->
  <rect x="120" y="60" width="960" height="6" rx="3" fill="#27ae60"/>

  <!-- Tamil word நிழல் (shade) — decorative top right of card -->
  <text x="1040" y="115" font-family="'Noto Sans Tamil', 'Tamil MN', serif" font-size="28"
        fill="#27ae60" opacity="0.55" text-anchor="end">நிழல்</text>

  <!-- Logo area -->
  <!-- Leaf icon -->
  <g transform="translate(168, 95)" filter="url(#glow)">
    <path d="M0 50 C0 20 30 0 60 0 C60 0 60 40 30 55 C10 62 0 50 0 50Z"
          fill="#27ae60"/>
    <path d="M0 50 C0 50 15 30 30 22" stroke="#1a7a40" stroke-width="2" fill="none"/>
  </g>

  <!-- Agent name -->
  <text x="252" y="145" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    NizhalAI
  </text>

  <!-- Tamil subtitle -->
  <text x="252" y="185" font-family="'Noto Sans Tamil', 'Tamil MN', serif"
        font-size="22" fill="#27ae60" letter-spacing="1">
    நிழல் · Shade · Safety · Community
  </text>

  <!-- Tagline -->
  <text x="252" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" fill="#d0e8ff" font-weight="300">
    Tamil-English AI for Community Climate Preparedness
  </text>

  <!-- Divider -->
  <line x1="168" y1="255" x2="1060" y2="255" stroke="#27ae60" stroke-width="1" opacity="0.4"/>

  <!-- Pill badges -->
  <!-- AWS Strands Agents -->
  <rect x="168" y="270" width="210" height="38" rx="19" fill="#0d3349" stroke="#1a8fc1" stroke-width="1.5"/>
  <text x="273" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#5dade2" text-anchor="middle">AWS Strands Agents</text>

  <!-- Amazon Bedrock -->
  <rect x="390" y="270" width="190" height="38" rx="19" fill="#0d3349" stroke="#f39c12" stroke-width="1.5"/>
  <text x="485" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#f5b942" text-anchor="middle">Amazon Bedrock</text>

  <!-- Nova 2 Lite -->
  <rect x="592" y="270" width="148" height="38" rx="19" fill="#0d3349" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="666" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#c39bd3" text-anchor="middle">Nova 2 Lite</text>

  <!-- Streamlit -->
  <rect x="752" y="270" width="130" height="38" rx="19" fill="#0d3349" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="817" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#f1948a" text-anchor="middle">Streamlit</text>

  <!-- Python 3.12 -->
  <rect x="894" y="270" width="148" height="38" rx="19" fill="#0d3349" stroke="#27ae60" stroke-width="1.5"/>
  <text x="968" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="15"
        fill="#82e0aa" text-anchor="middle">Python 3.12</text>

  <!-- Bottom tagline on image -->
  <text x="600" y="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" fill="#ffffff" text-anchor="middle" opacity="0.7">
    Building safer, climate-resilient communities through AI.
  </text>
</svg>
